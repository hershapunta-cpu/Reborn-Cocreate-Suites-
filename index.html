<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f5f9; --surface:#ffffff; --ink:#14213a; --muted:#566178; --line:#d6dde8;
  --navy:#12284a; --gold:#b88a12; --goldbg:#f6ecc9; --teal:#1f7a6c; --bad:#b3402e; --chip:#e8edf5; --on-navy:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c182b; --surface:#13233d; --ink:#e8eef7; --muted:#9aa9c0; --line:#263858;
    --navy:#1d3a69; --gold:#e0b53c; --goldbg:#3a3014; --teal:#4cc2ae; --bad:#ff8a73; --chip:#1c2f50;
  }
}
:root[data-theme="dark"]{
  --bg:#0c182b; --surface:#13233d; --ink:#e8eef7; --muted:#9aa9c0; --line:#263858;
  --navy:#1d3a69; --gold:#e0b53c; --goldbg:#3a3014; --teal:#4cc2ae; --bad:#ff8a73; --chip:#1c2f50;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header.top{background:var(--navy);color:var(--on-navy);padding:14px 16px 12px;border-bottom:4px solid var(--gold);display:flex;gap:10px;align-items:center;justify-content:space-between}
header.top h1{font-size:21px}
header.top p{margin:3px 0 0;font-size:12.5px;opacity:.85}
.theme{border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--on-navy);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:36px}
main{max-width:760px;margin:0 auto;padding:14px 14px 24px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 140px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:42px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn.small{padding:5px 10px;min-height:34px;font-size:13px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:42px}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.meta{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:24px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.note{background:var(--goldbg);border-left:4px solid var(--gold);padding:9px 12px;border-radius:6px;font-size:13.5px;margin:10px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:grid;grid-template-columns:26px 1fr 92px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item input[type=checkbox]{width:22px;height:22px}
.item input[type=number]{min-height:38px;padding:6px 8px}
.chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;background:var(--chip);border:1px solid var(--line);margin-left:6px;vertical-align:middle}
.chip.mo{background:var(--goldbg);border-color:var(--gold)}
.slider{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.slider output{font-weight:600;min-width:64px;text-align:right}
input[type=range]{width:100%;accent-color:var(--gold);min-height:36px}
.bar{height:12px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--teal)}
.out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;margin-top:1px;flex:none}
.tag{font-size:11.5px;font-weight:600;color:var(--teal);margin-left:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 2px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:52px;border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20}
@media (min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div style="display:flex;gap:10px;align-items:center;min-width:0"><img id="logo" width="42" height="42" alt="ReBoRn shield logo" style="border-radius:10px;flex:none"><div><h1>ReBoRn Co-Create Suite</h1><p>Scope it. Simulate it. Plan it. Brief it.</p></div></div>
  <button class="theme" id="themeBtn" aria-label="Change colour theme">Theme: Auto</button>
</header>
<main id="view" aria-live="polite"></main>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="quote">Quote</button>
  <button role="tab" data-tab="roi">Simulator</button>
  <button role="tab" data-tab="road">Roadmap</button>
  <button role="tab" data-tab="brief">Brief</button>
</nav>

<script>
var KEY="reborn-cocreate-v1", FX=2.7;
var ITEMS=[
 ["Web and digital",[
  ["w1","Growth Assessment",250,"s"],["w2","One-page enquiry website",350,"s"],["w3","Google Business profile clean-up",120,"s"],
  ["w4","Enquiry form with click-to-call and WhatsApp",80,"s"],["w5","Business card design, print-ready PDF",60,"s"],["w6","Site care and updates",100,"m"]]],
 ["Social and brand",[
  ["s1","Brand identity: logo, colours, voice",300,"s"],["s2","Content pack, 12 posts",180,"m"],
  ["s3","Social media management",400,"m"],["s4","Review requests and reply support",80,"m"]]],
 ["Performance",[
  ["p1","Ad account setup and tracking",200,"s"],["p2","Ad management (ad spend billed separately)",300,"m"],["p3","Monthly Growth Scorecard report",120,"m"]]],
 ["Fund services",[
  ["f1","Funding and grant search",150,"s"],["f2","Grant application writing, per application",350,"s"],
  ["f3","Sponsor pack and outreach",300,"s"],["f4","Fundraising campaign page and plan",500,"s"]]]
];
var PRESETS={cautious:{spend:300,cpc:0.8,enq:3,close:15,sale:150,fee:300},base:{spend:500,cpc:0.5,enq:5,close:25,sale:200,fee:300},strong:{spend:800,cpc:0.35,enq:8,close:30,sale:250,fee:400}};
var ROAD=[
 ["Days 1 to 15","Diagnose and set a baseline",["Run the Growth Assessment","Get access to profiles and accounts","Record baseline enquiries, calls and reviews","Agree priorities and approvals"]],
 ["Days 16 to 30","Repair the biggest weaknesses",["Fix contact paths and click-to-call","Add service pages and areas served","Set up an enquiry or quote form","Correct the Google Business profile"]],
 ["Days 31 to 60","Improve acquisition",["Publish relevant local content","Start approved outreach or advertising","Collect reviews with permission","Check every enquiry gets a follow-up"]],
 ["Days 61 to 75","Analyse and refine",["Review lead quality","Find conversion bottlenecks","Adjust campaigns using real data"]],
 ["Days 76 to 90","Evaluate and plan",["Send the Growth Scorecard","Hold the results review","Agree the next 90-day priorities","Discuss renewal"]]
];
var INDUSTRIES=["Locksmith","Pressure washing","Gardening and landscaping","Fencing","Foundation and concrete","Towing","Gutter cleaning","Window cleaning","Private chef","Restaurant","Other local business"];
var S={tab:"quote",theme:"auto",client:"",sel:{},price:{},disc:0,roi:Object.assign({},PRESETS.base),checks:{},brief:{biz:"",ind:"Restaurant",loc:"",goal:"More calls and enquiries",aud:"",budget:300,tone:"Friendly",chan:"Google profile and Facebook"},briefOut:""};
ITEMS.forEach(function(g){g[1].forEach(function(i){S.price[i[0]]=i[2]})});

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function n0(x){return Math.round(x).toLocaleString("en-US")}
function dual(x){return "US$"+n0(x)+" / EC$"+n0(x*FX)}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1800)}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);Object.keys(d).forEach(function(k){if(k==="price")Object.assign(S.price,d.price);else if(k==="roi")Object.assign(S.roi,d.roi);else if(k==="brief")Object.assign(S.brief,d.brief);else S[k]=d[k]})}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({theme:S.theme,client:S.client,sel:S.sel,price:S.price,disc:S.disc,roi:S.roi,checks:S.checks,brief:S.brief}))}catch(e){}}
function copy(t){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?"Copied":"Select the text and copy it")}
function applyTheme(){var r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme);document.getElementById("themeBtn").textContent="Theme: "+S.theme.charAt(0).toUpperCase()+S.theme.slice(1)}

/* ---------- Quote ---------- */
function totals(){var s=0,m=0;ITEMS.forEach(function(g){g[1].forEach(function(i){if(S.sel[i[0]]){var p=+S.price[i[0]]||0;if(i[3]==="s")s+=p;else m+=p}})});var d=s*(S.disc/100);return{s:s,m:m,d:d,net:s-d}}
function quoteText(){
  var t=totals(),L=[];
  L.push("ReBoRn Marketing Solution Agency");L.push("Quote for "+(S.client||"[client name]")+", "+new Date().toLocaleDateString());L.push("");
  var su=[],mo=[];
  ITEMS.forEach(function(g){g[1].forEach(function(i){if(S.sel[i[0]]){var line="- "+i[1]+": US$"+n0(+S.price[i[0]]||0);(i[3]==="s"?su:mo).push(line)}})});
  if(su.length){L.push("One-time setup");L=L.concat(su);L.push("")}
  if(mo.length){L.push("Monthly");L=L.concat(mo);L.push("")}
  L.push("Setup total: "+dual(t.s));
  if(S.disc>0)L.push("Setup after "+S.disc+"% discount: "+dual(t.net));
  L.push("Monthly total: "+dual(t.m));
  L.push("First-year value: "+dual(t.net+t.m*12));
  L.push("");L.push("Notes: Ad spend and third-party software are billed separately. Prices are estimates until agreed in writing. No guarantee of rankings, sales or revenue is made. EC$ shown at 2.70 per US$.");
  L.push("Contact: 268-734-2833");
  return L.join("\n");
}
function vQuote(){
  var t=totals();
  var groups=ITEMS.map(function(g){return '<div class="card"><h3>'+g[0]+'</h3>'+g[1].map(function(i){
    return '<div class="item"><input type="checkbox" data-sel="'+i[0]+'" aria-label="Include '+esc(i[1])+'" '+(S.sel[i[0]]?"checked":"")+'><div>'+esc(i[1])+'<span class="chip '+(i[3]==="m"?"mo":"")+'">'+(i[3]==="m"?"Monthly":"Setup")+'</span></div><input id="pr_'+i[0]+'" type="number" inputmode="decimal" min="0" step="10" data-price="'+i[0]+'" aria-label="Price in US dollars for '+esc(i[1])+'" value="'+S.price[i[0]]+'"></div>'}).join("")+'</div>'}).join("");
  return '<div class="note">Starter prices in US$ are placeholders. Edit each price to match your own rates before sending a quote.</div>'+
  '<label for="client">Client or business name</label><input id="client" type="text" value="'+esc(S.client)+'" placeholder="Who is this quote for?">'+groups+
  '<label for="disc">Setup discount, %</label><input id="disc" type="number" inputmode="decimal" min="0" max="100" step="1" value="'+S.disc+'">'+
  '<div class="grid" style="margin-top:12px"><div class="stat"><b>US$'+n0(t.net)+'</b><span>Setup, EC$'+n0(t.net*FX)+'</span></div><div class="stat"><b>US$'+n0(t.m)+'</b><span>Per month, EC$'+n0(t.m*FX)+'</span></div><div class="stat"><b>US$'+n0(t.net+t.m*12)+'</b><span>First-year value</span></div><div class="stat"><b>'+Object.keys(S.sel).filter(function(k){return S.sel[k]}).length+'</b><span>Services selected</span></div></div>'+
  '<div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="copyQuote">Copy quote text</button><button class="btn" data-act="clearQuote">Clear</button></div>'+
  '<div class="out" style="margin-top:10px">'+esc(quoteText())+'</div>';
}

/* ---------- ROI ---------- */
var FMT={spend:function(v){return "US$"+n0(v)},cpc:function(v){return "US$"+(+v).toFixed(2)},enq:function(v){return v+"%"},close:function(v){return v+"%"},sale:function(v){return "US$"+n0(v)},fee:function(v){return "US$"+n0(v)}};
function sl(k,l,min,max,step){return '<label for="r_'+k+'">'+l+'</label><div class="slider"><input id="r_'+k+'" data-roi="'+k+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+S.roi[k]+'"><output id="o_'+k+'">'+FMT[k](S.roi[k])+'</output></div>'}
function roiResults(){
  var r=S.roi,clicks=r.cpc>0?r.spend/r.cpc:0,enq=clicks*r.enq/100,sales=enq*r.close/100,rev=sales*r.sale,cpe=enq>0?r.spend/enq:0,roas=r.spend>0?rev/r.spend:0,net=rev-r.spend-r.fee;
  var mx=Math.max(r.spend,r.fee,rev,1);
  var bar=function(l,v,c){return '<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><span>'+l+'</span><b>US$'+n0(v)+'</b></div><div class="bar"><i style="width:'+(v/mx*100)+'%;background:'+c+'"></i></div></div>'};
  return '<div class="grid" style="margin-top:14px"><div class="stat"><b>'+n0(clicks)+'</b><span>Clicks a month</span></div><div class="stat"><b>'+(Math.round(enq*10)/10)+'</b><span>Enquiries</span></div><div class="stat"><b>'+(Math.round(sales*10)/10)+'</b><span>Sales</span></div><div class="stat"><b>'+(roas?roas.toFixed(1)+"x":"-")+'</b><span>Revenue per US$1 of ads</span></div></div>'+
  '<div class="card"><h3>Money in and out</h3>'+bar("Ad spend",r.spend,"var(--navy)")+bar("Management fee",r.fee,"var(--gold)")+bar("Client revenue",rev,"var(--teal)")+
  '<p class="meta">Cost per enquiry: '+(cpe?"US$"+cpe.toFixed(2):"-")+'. Revenue minus ad spend and fee: US$'+n0(net)+' (this is revenue, not profit, because the client\'s own costs are not included).</p></div>';
}
function vRoi(){
  return '<div class="note">An illustration with your own assumptions, not a prediction or a benchmark. Real results depend on the business, offer, market and follow-up.</div>'+
  '<div class="row"><button class="btn small" data-preset="cautious">Cautious</button><button class="btn small" data-preset="base">Base</button><button class="btn small" data-preset="strong">Strong</button></div>'+
  sl("spend","Monthly ad spend, US$",0,5000,50)+sl("cpc","Cost per click, US$",0.1,3,0.05)+sl("enq","Clicks that become enquiries, %",0.5,15,0.5)+
  sl("close","Enquiries that become sales, %",1,50,1)+sl("sale","Average sale value, US$",10,5000,10)+sl("fee","Management fee per month, US$",0,1500,25)+
  '<div id="roiOut">'+roiResults()+'</div>';
}

/* ---------- Roadmap ---------- */
function vRoad(){
  var total=0,done=0;
  var cards=ROAD.map(function(p,i){var d=0;var items=p[2].map(function(x,j){var id="rm"+i+"_"+j;total++;if(S.checks[id]){done++;d++}return '<label class="check"><input type="checkbox" data-ck="'+id+'" '+(S.checks[id]?"checked":"")+'><span>'+esc(x)+'</span></label>'}).join("");
    return '<div class="card"><div class="row" style="justify-content:space-between"><h3>'+p[0]+'</h3><span class="meta">'+d+' of '+p[2].length+'</span></div><div class="meta">'+p[1]+'</div>'+items+'</div>'}).join("");
  var pct=total?Math.round(done/total*100):0;
  return '<label for="client2">Client or business name</label><input id="client2" type="text" value="'+esc(S.client)+'" placeholder="Same name as the quote">'+
  '<div class="card"><div class="row" style="justify-content:space-between"><h3>'+(S.client?esc(S.client)+": ":"")+'90-day Growth Roadmap</h3><b>'+pct+'%</b></div><div class="bar"><i style="width:'+pct+'%"></i></div><p class="meta">'+done+' of '+total+' steps done. Skip steps that do not fit the client, because strategy follows the business problem.</p></div>'+cards+
  '<div class="row"><button class="btn" data-act="resetRoad">Reset checklist</button></div>';
}

/* ---------- Brief ---------- */
function opt(arr,v){return arr.map(function(a){return '<option '+(a===v?"selected":"")+'>'+esc(a)+'</option>'}).join("")}
function vBrief(){
  var b=S.brief;
  return '<div class="note">This builder fills a structured template from your answers. It does not call an AI service, so check and adjust the wording before use.</div>'+
  '<label for="b_biz">Business name</label><input id="b_biz" data-b="biz" type="text" value="'+esc(b.biz)+'">'+
  '<div class="two"><div><label for="b_ind">Industry</label><select id="b_ind" data-b="ind">'+opt(INDUSTRIES,b.ind)+'</select></div><div><label for="b_loc">Parish, town or island</label><input id="b_loc" data-b="loc" type="text" value="'+esc(b.loc)+'"></div></div>'+
  '<div class="two"><div><label for="b_goal">Main goal</label><select id="b_goal" data-b="goal">'+opt(["More calls and enquiries","More quote requests","More bookings","Funding or sponsors","Brand awareness"],b.goal)+'</select></div><div><label for="b_tone">Tone</label><select id="b_tone" data-b="tone">'+opt(["Friendly","Professional","Bold","Premium"],b.tone)+'</select></div></div>'+
  '<label for="b_aud">Who are the customers?</label><textarea id="b_aud" data-b="aud" placeholder="For example: villa managers, families, hotels">'+esc(b.aud)+'</textarea>'+
  '<div class="two"><div><label for="b_budget">Monthly budget, US$</label><input id="b_budget" data-b="budget" type="number" inputmode="decimal" min="0" value="'+esc(b.budget)+'"></div><div><label for="b_chan">Main channel</label><select id="b_chan" data-b="chan">'+opt(["Google profile and Facebook","Website and Google","WhatsApp and Instagram","Paid ads","Email and events"],b.chan)+'</select></div></div>'+
  '<div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="gen">Build brief</button></div>'+
  (S.briefOut?'<div class="out" style="margin-top:10px">'+esc(S.briefOut)+'</div><div class="row" style="margin-top:8px"><button class="btn" data-act="copyBrief">Copy brief</button></div>':'<div class="meta" style="margin-top:10px">Fill in the details, then build the brief.</div>');
}
function genBrief(){
  var b=S.brief,name=b.biz||"[Business]",loc=b.loc||"[location]",aud=b.aud||"local customers",fund=b.goal==="Funding or sponsors";
  var angles=fund?["Mission clarity: say plainly what "+name+" is raising money for and why it matters in "+loc+".","Impact proof: share real outcomes with permission, not promises.","Easy to give or sponsor: one clear link, phone number or WhatsApp for donors and sponsors."]
   :["Trust: "+name+" is a reliable local "+b.ind.toLowerCase()+" serving "+loc+", with clear and honest information.","Proof: show real work, photos or customer stories shared with permission.","Convenience: make it one tap to call, message on WhatsApp or request a quote."];
  var persona=fund?[["Ready supporter","Wants to help quickly","Unsure where money goes","Show clear use of funds and a simple way to give"],["Cautious sponsor","Wants visibility and trust","Needs proof and reporting","Offer a sponsor pack with clear benefits"],["Community referrer","Shares with others","Needs an easy story to pass on","Give short shareable posts and links"]]
   :[["Ready buyer","Needs "+b.ind.toLowerCase()+" now","Wants a fast answer and fair price","Prominent call, WhatsApp and clear service area"],["Careful researcher","Compares options in "+loc,"Worried about quality and trust","Photos, reviews and plain-language service pages"],["Referrer or manager","Recommends or books for others","Needs reliability and communication","Show recurring options and a simple booking path"]];
  var measures=fund?["Enquiries from donors or sponsors","Sponsor meetings held","Funds pledged (record actual figures only)"]:["Calls and WhatsApp taps","Quote or enquiry forms received","Enquiries that became jobs"];
  var T=[];
  T.push("CREATIVE BRIEF: "+name);T.push("Prepared "+new Date().toLocaleDateString()+" by ReBoRn Marketing Solution Agency");T.push("");
  T.push("1. SNAPSHOT");T.push("Business: "+name+" ("+b.ind+", "+loc+")");T.push("Goal: "+b.goal);T.push("Customers: "+aud);T.push("Tone: "+b.tone);T.push("Main channel: "+b.chan);T.push("Monthly budget: US$"+n0(+b.budget||0)+" (ad spend and fees to be separated)");T.push("");
  T.push("2. PERSONA MATRIX");persona.forEach(function(p){T.push("- "+p[0]+" | Need: "+p[1]+" | Concern: "+p[2]+" | Message: "+p[3])});T.push("");
  T.push("3. CAMPAIGN ANGLES");angles.forEach(function(a,i){T.push((i+1)+". "+a)});T.push("");
  T.push("4. FIRST 30 DAYS");T.push("Week 1: Check profile, website and contact paths. Record the baseline.");T.push("Week 2: Fix the biggest gaps. Prepare 12 posts or key pages in a "+b.tone.toLowerCase()+" tone.");T.push("Week 3: Launch on "+b.chan+". Start outreach only through public business channels.");T.push("Week 4: Review results and agree the next priorities.");T.push("");
  T.push("5. MEASURES");measures.forEach(function(m){T.push("- "+m)});T.push("");
  T.push("6. GUARDRAILS");T.push("- No promises of rankings, sales or revenue.");T.push("- Get permission before using customer names, reviews or photos.");T.push("- Verify any credentials or claims before publishing them.");T.push("- Give a simple way to opt out of any direct messages.");
  S.briefOut=T.join("\n");save();render();
}

/* ---------- Shell ---------- */
function render(){
  var f={quote:vQuote,roi:vRoi,road:vRoad,brief:vBrief}[S.tab];
  var ae=document.activeElement,id=ae&&ae.id,pos=ae&&ae.selectionStart;
  document.getElementById("view").innerHTML=f();
  document.querySelectorAll("nav.tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===S.tab)});
  if(id){var el=document.getElementById(id);if(el&&el.tagName!=="SELECT"&&el.type!=="range"){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab]");if(t){S.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(e.target.id==="themeBtn"){S.theme={auto:"light",light:"dark",dark:"auto"}[S.theme]||"auto";applyTheme();save();return}
  var p=e.target.closest("[data-preset]");if(p){Object.assign(S.roi,PRESETS[p.dataset.preset]);save();render();return}
  var a=e.target.closest("[data-act]");if(!a)return;var k=a.dataset.act;
  if(k==="copyQuote")copy(quoteText());
  else if(k==="clearQuote"){S.sel={};S.disc=0;save();render()}
  else if(k==="resetRoad"){if(confirm("Clear every checkbox in the roadmap?")){S.checks={};save();render()}}
  else if(k==="gen")genBrief();
  else if(k==="copyBrief")copy(S.briefOut);
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="client"||t.id==="client2"){S.client=t.value;save();if(t.id==="client2"){render()}else{var o=document.querySelector(".out");if(o)o.textContent=quoteText()}return}
  if(t.dataset.price){S.price[t.dataset.price]=parseFloat(t.value)||0;save();render();return}
  if(t.id==="disc"){S.disc=Math.min(100,Math.max(0,parseFloat(t.value)||0));save();render();return}
  if(t.dataset.roi){var k=t.dataset.roi;S.roi[k]=parseFloat(t.value)||0;save();var o=document.getElementById("o_"+k);if(o)o.textContent=FMT[k](S.roi[k]);document.getElementById("roiOut").innerHTML=roiResults();return}
  if(t.dataset.b){S.brief[t.dataset.b]=t.value;save()}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.sel){S.sel[t.dataset.sel]=t.checked;save();render()}
  else if(t.dataset.ck){S.checks[t.dataset.ck]=t.checked;save();render()}
  else if(t.dataset.b){S.brief[t.dataset.b]=t.value;save()}
});
try{document.getElementById("logo").src=document.querySelector('link[rel="apple-touch-icon"]').href}catch(e){}
load();applyTheme();render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
